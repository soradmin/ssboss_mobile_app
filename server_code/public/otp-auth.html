<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SSBOSS — Вход</title>
    <link rel="icon" type="image/x-icon" href="/favicon.png">
    <style>
        :root {
            --ink: #1a1523;
            --muted: #8b8395;
            --brand: #8813ba;
            --brand-mid: #b02fe0;
            --brand-light: #e040fb;
            --field: #faf7fc;
            --border: #e8e0ef;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif;
            background: #f3f0f6;
            color: var(--ink);
            display: flex;
            flex-direction: column;
        }
        .wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
        }
        .card {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border-radius: 20px;
            padding: 36px 32px 28px;
            box-shadow: 0 12px 40px rgba(136, 19, 186, 0.08);
        }
        .logo {
            font-weight: 800;
            font-size: 28px;
            letter-spacing: -0.6px;
            background: linear-gradient(90deg, var(--brand), var(--brand-mid), var(--brand-light));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-align: center;
            margin: 0 0 8px;
        }
        h1 {
            margin: 0 0 8px;
            font-size: 20px;
            text-align: center;
            font-weight: 700;
        }
        .sub {
            text-align: center;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.5;
            margin: 0 0 24px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin: 0 0 8px;
        }
        .phone-row, .field {
            display: flex;
            align-items: center;
            background: var(--field);
            border: 1px solid var(--border);
            border-radius: 12px;
            height: 52px;
            padding: 0 14px;
            margin-bottom: 14px;
        }
        .prefix {
            font-weight: 700;
            color: var(--brand);
            margin-right: 8px;
            white-space: nowrap;
        }
        input {
            border: 0;
            outline: none;
            background: transparent;
            width: 100%;
            font-size: 15px;
            color: var(--ink);
        }
        .btn {
            width: 100%;
            height: 50px;
            border: 0;
            border-radius: 25px;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(90deg, var(--brand), var(--brand-mid), var(--brand-light));
            margin-top: 8px;
        }
        .btn:disabled { opacity: 0.55; cursor: default; }
        .err {
            display: none;
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 13px;
            margin-bottom: 12px;
        }
        .err.show { display: block; }
        .links {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: var(--muted);
        }
        .links a { color: var(--brand); font-weight: 700; text-decoration: none; }
        .hint { font-size: 13px; color: var(--muted); text-align: center; margin: 12px 0 0; }
        footer {
            text-align: center;
            color: var(--muted);
            font-size: 12px;
            padding: 16px;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="card">
        <p class="logo">ssboss</p>
        <h1 id="title">Добро пожаловать в SSBOSS</h1>
        <p class="sub" id="subtitle">Введите номер телефона — мы отправим код в SMS.</p>
        <div class="err" id="error"></div>

        <div id="step-phone">
            <label for="local">Номер телефона</label>
            <div class="phone-row">
                <span class="prefix">+992</span>
                <input id="local" type="tel" inputmode="numeric" maxlength="9" autocomplete="tel"
                       placeholder="100557887">
            </div>
            <button class="btn" id="send-btn" type="button">Отправить код</button>
        </div>

        <div id="step-code" class="hidden">
            <label for="code">Код из SMS</label>
            <div class="field">
                <input id="code" type="tel" inputmode="numeric" maxlength="6" autocomplete="one-time-code"
                       placeholder="4 цифры">
            </div>
            <button class="btn" id="verify-btn" type="button">Войти</button>
            <p class="hint" id="resend-hint"></p>
            <button class="btn" id="resend-btn" type="button" style="margin-top:12px;display:none;">Отправить код ещё раз</button>
        </div>

        <div class="links">Если аккаунта ещё нет, он создастся после кода из SMS.</div>
    </div>
</div>
<footer id="copy"></footer>
<script>
(function () {
    var title = document.getElementById('title');
    var subtitle = document.getElementById('subtitle');
    var errorEl = document.getElementById('error');
    var localInput = document.getElementById('local');
    var codeInput = document.getElementById('code');
    var sendBtn = document.getElementById('send-btn');
    var verifyBtn = document.getElementById('verify-btn');
    var resendBtn = document.getElementById('resend-btn');
    var resendHint = document.getElementById('resend-hint');
    var stepPhone = document.getElementById('step-phone');
    var stepCode = document.getElementById('step-code');
    var phone992 = '';
    var wait = 60;
    var timer = null;

    document.getElementById('copy').textContent =
        '© ' + new Date().getFullYear() + ' — Все права защищены SSBOSS Маркетплейс';
    document.title = 'SSBOSS — Вход';
    (function setGreeting() {
        var h = (new Date().getUTCHours() + 5) % 24;
        var text = 'Доброй ночи';
        if (h >= 5 && h < 12) text = 'Доброе утро';
        else if (h >= 12 && h < 17) text = 'Добрый день';
        else if (h >= 17 && h < 23) text = 'Добрый вечер';
        title.textContent = text;
    })();
    subtitle.textContent = 'Введите номер телефона — мы отправим код в SMS. Новый аккаунт создаётся автоматически.';

    function showError(msg) {
        errorEl.textContent = msg || 'Ошибка';
        errorEl.classList.add('show');
    }
    function clearError() {
        errorEl.classList.remove('show');
        errorEl.textContent = '';
    }
    function extractError(data) {
        if (!data) return 'Ошибка запроса';
        if (typeof data.message === 'string' && data.message && data.status && data.status !== 200) return data.message;
        if (data.data && Array.isArray(data.data.form) && data.data.form.length) {
            var first = data.data.form[0];
            if (typeof first === 'string') return first;
            if (first && first.message) return first.message;
        }
        if (typeof data.error === 'string') return data.error;
        return 'Ошибка запроса';
    }
    function normalizeLocal(raw) {
        var d = String(raw || '').replace(/\D/g, '');
        if (d.indexOf('992') === 0 && d.length >= 12) d = d.slice(3);
        if (d.length > 9) d = d.slice(0, 9);
        return d;
    }
    localInput.addEventListener('input', function () {
        localInput.value = normalizeLocal(localInput.value);
    });

    function setCookie(token) {
        var encoded = encodeURIComponent(JSON.stringify(token));
        document.cookie = 'ishop_frontend_auth=' + encoded + '; Path=/; Max-Age=31536000; SameSite=Lax';
        try { localStorage.setItem('ishop_frontend_auth', JSON.stringify(token)); } catch (e) {}
    }

    function startTimer(sec) {
        wait = sec || 60;
        resendBtn.style.display = 'none';
        resendHint.style.display = 'block';
        if (timer) clearInterval(timer);
        function tick() {
            if (wait <= 0) {
                clearInterval(timer);
                resendHint.style.display = 'none';
                resendBtn.style.display = 'block';
                return;
            }
            resendHint.textContent = 'Повторная отправка через ' + wait + ' сек.';
            wait -= 1;
        }
        tick();
        timer = setInterval(tick, 1000);
    }

    async function api(path, body) {
        var res = await fetch(path, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json',
                'language': 'ru'
            },
            body: JSON.stringify(body)
        });
        var data = await res.json().catch(function () { return null; });
        if (!data || typeof data !== 'object') {
            throw new Error('Сервер не ответил. Проверьте адрес API.');
        }
        if (!res.ok || (data.status && data.status !== 200) || data.exception) {
            throw new Error(extractError(data));
        }
        if (!data.data && !data.token) {
            throw new Error(extractError(data) || 'Не удалось отправить запрос');
        }
        return data;
    }

    async function sendCode() {
        clearError();
        var local = normalizeLocal(localInput.value);
        if (local.length !== 9) {
            showError('Введите 9 цифр номера без +992');
            return;
        }
        phone992 = '992' + local;
        sendBtn.disabled = true;
        try {
            var data = await api('/api/v1/user/otp/send', {
                phone: phone992
            });
            if (data.data && data.data.phone) phone992 = data.data.phone;
            stepPhone.classList.add('hidden');
            stepCode.classList.remove('hidden');
            subtitle.textContent = 'Мы отправили код на +' + phone992;
            startTimer((data.data && data.data.resend_in) || 60);
            codeInput.focus();
        } catch (e) {
            showError(e.message);
        } finally {
            sendBtn.disabled = false;
        }
    }

    async function verify() {
        clearError();
        var code = codeInput.value.replace(/\D/g, '');
        if (code.length < 4) {
            showError('Введите код из SMS');
            return;
        }
        verifyBtn.disabled = true;
        try {
            var data = await api('/api/v1/user/otp/verify', {
                phone: phone992,
                code: code
            });
            var token = data.token;
            if ((!token || token.length < 10) && data.data && data.data.token) {
                token = data.data.token;
            }
            if (!token) throw new Error('Не удалось получить токен');
            setCookie(token);
            window.location.replace('/');
        } catch (e) {
            showError(e.message);
            verifyBtn.disabled = false;
        }
    }

    sendBtn.addEventListener('click', sendCode);
    verifyBtn.addEventListener('click', verify);
    resendBtn.addEventListener('click', sendCode);
    codeInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') verify();
    });
    localInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') sendCode();
    });
})();
</script>
</body>
</html>
